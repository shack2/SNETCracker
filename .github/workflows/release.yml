name: release

# 打 tag（v*）触发构建并创建 GitHub Release；也可手动 workflow_dispatch 只构建验证不发版
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT Linux 工具链（macOS 自带 Xcode CLT，Windows 自带 MSVC）
      - name: Install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME}"
          if [[ "$V" == v* && "$GITHUB_REF" == refs/tags/* ]]; then
            V="${V:1}"
          else
            # 手动构建使用项目当前版本，并确保 UI/CLI 没有漂移
            V=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def project_version(path):
              return ET.parse(Path(path)).getroot().findtext("./PropertyGroup/Version").strip()

          ui = project_version("SPasswordCheckerV2/SPasswordCheckerV2.csproj")
          cli = project_version("SPasswordCheckerV2.Cmd/SPasswordCheckerV2.Cmd.csproj")
          if ui != cli:
              raise SystemExit(f"UI/CLI version mismatch: {ui} != {cli}")
          print(ui)
          PY
          )
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish GUI (AOT)
        run: dotnet publish SPasswordCheckerV2/SPasswordCheckerV2.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.ver.outputs.version }} --self-contained true

      - name: Publish CLI spc (AOT)
        run: dotnet publish SPasswordCheckerV2.Cmd/SPasswordCheckerV2.Cmd.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.ver.outputs.version }} --self-contained true

      # 组装：UI 发布产物（含 config）+ CLI 可执行文件，一个包双形态
      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ui = "SPasswordCheckerV2/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $cli = "SPasswordCheckerV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $dist = "dist/SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "$ui/*" $dist -Recurse -Force -Exclude *.pdb
          Get-ChildItem $dist -Recurse -Filter *.pdb | Remove-Item -Force
          Copy-Item "$cli/spc.exe" "$dist/spc.exe" -Force
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}.zip" -Force
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - name: Assemble package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          UI="SPasswordCheckerV2/bin/Release/net10.0/${{ matrix.rid }}/publish"
          CLI="SPasswordCheckerV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          DIST="dist/SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}"
          mkdir -p "$DIST"
          cp -r "$UI/." "$DIST/"
          find "$DIST" -name '*.pdb' -delete
          cp "$CLI/spc" "$DIST/spc"
          chmod +x "$DIST/SPasswordCheckerV2" "$DIST/spc"
          tar -czf "dist/SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}.tar.gz" -C dist "SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}"
          # 更新服务仅收 zip：额外打一份（保留可执行位）
          python3 - <<'PY'
          import os, zipfile
          name = "SNETCracker_${{ steps.ver.outputs.version }}_${{ matrix.rid }}"
          with zipfile.ZipFile(f"dist/{name}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(f"dist/{name}"):
                  for f in files:
                      p = os.path.join(root, f)
                      zi = zipfile.ZipInfo(os.path.relpath(p, "dist"))
                      zi.external_attr = (os.stat(p).st_mode & 0xFFFF) << 16
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      with open(p, "rb") as fh:
                          z.writestr(zi, fh.read())
          PY
          ls -la dist/*.tar.gz dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SNETCracker-${{ matrix.rid }}
          path: |
            dist/SNETCracker_*.zip
            dist/SNETCracker_*.tar.gz
          if-no-files-found: error

  skill-package:
    name: SKILL (Windows + Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SNETCracker-win-x64
          path: pkg-win

      - uses: actions/download-artifact@v4
        with:
          name: SNETCracker-linux-x64
          path: pkg-linux

      - name: Assemble dual-platform SKILL package
        run: python3 .github/scripts/skill_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: SNETCracker-SKILL
          path: dist/SPasswordCheckerV2.SKILL_*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, skill-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # 发版后把四平台包同步到自建更新服务（soft.shack2.cn），老客户端启动即可收到更新提示
  sync-update-service:
    name: sync soft.shack2.cn
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SOFTUPDATE_API_KEY: ${{ secrets.SOFTUPDATE_API_KEY }}
      SOFTUPDATE_SERVER: http://soft.shack2.cn
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SNETCracker-*
          path: pkg

      - name: Upload all platform packages to SoftUpdate
        run: python3 .github/scripts/softupdate_sync.py
